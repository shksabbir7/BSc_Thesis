<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1221" viewBox="0 0 1400 1221"><style>text{fill:#000;text-rendering:geometricPrecision}.head{font-family:'Times New Roman',serif;font-size:32px;font-weight:700}.meta{font-family:'Times New Roman',serif;font-size:29px;font-weight:500}.bn{font-family:'Nirmala UI','SolaimanLipi',sans-serif;font-size:32px;font-weight:500}.rule{stroke:#111;stroke-width:2.8;shape-rendering:crispEdges}.light{stroke:#555;stroke-width:1.5;shape-rendering:crispEdges}</style><rect width="100%" height="100%" fill="#fff"/><line x1="36" y1="36" x2="1364" y2="36" class="rule"/><text x="58" y="96" class="head">Example</text><text x="205" y="96" class="head">Selection role</text><text x="535" y="96" class="head">Generated Bangla response</text><line x1="36" y1="124" x2="1364" y2="124" class="rule"/><text x="58" y="182.0" class="meta">E1</text><text x="205" y="182.0" class="meta">Baseline failure (L0)</text><text x="535" y="183.0" class="bn">ব্যাপারটা খুবই দুঃখজনক! এমন একটা গল্প! 😥😥</text><line x1="36" y1="220" x2="1364" y2="220" class="light"/><text x="58" y="338.0" class="meta">E2</text><text x="205" y="338.0" class="meta">Baseline failure (L1)</text><text x="535" y="271.5" class="bn">গল্পটা দেখাচ্ছিল, একটা মেয়ের জীবন</text><text x="535" y="316.5" class="bn">এভাবে শেষ হয়ে যায়! মেনে নিতে পারলাম</text><text x="535" y="361.5" class="bn">না, এত সুন্দর একটা প্রাণ এভাবে চলে</text><text x="535" y="406.5" class="bn">গেল।</text><line x1="36" y1="436" x2="1364" y2="436" class="light"/><text x="58" y="531.5" class="meta">E3</text><text x="205" y="531.5" class="meta">Residual failure (L0)</text><text x="535" y="487.5" class="bn">ব্যাপারটা পুরাই অন্যরকম! শেষটা মনে হল</text><text x="535" y="532.5" class="bn">যেন একটু বেশি প্যাঁচানো ছিল, তবে ছবিটা</text><text x="535" y="577.5" class="bn">ভালোই।</text><line x1="36" y1="607" x2="1364" y2="607" class="light"/><text x="58" y="680.0" class="meta">E4</text><text x="205" y="680.0" class="meta">Residual failure (L1)</text><text x="535" y="658.5" class="bn">আশা মারা গেল এটা মেনে নিতে পারিনি, এমন</text><text x="535" y="703.5" class="bn">একটা সুন্দর গল্পে এত বড় একটা ধাক্কা!</text><line x1="36" y1="733" x2="1364" y2="733" class="light"/><text x="58" y="828.5" class="meta">E5</text><text x="205" y="828.5" class="meta">Repaired output (L0)</text><text x="535" y="784.5" class="bn">অসাধারণ! গল্পটা খুবই হৃদয়স্পর্শী, এমন</text><text x="535" y="829.5" class="bn">একটা ছবি দেখে মনটা একেবারে খাঁ খাঁ করে</text><text x="535" y="874.5" class="bn">উঠলো।</text><line x1="36" y1="904" x2="1364" y2="904" class="light"/><text x="58" y="1044.5" class="meta">E6</text><text x="205" y="1044.5" class="meta">Budget exhaustion (L1)</text><text x="535" y="955.5" class="bn">ছবিটা দেখেই বোঝা যাচ্ছে মাল কাহিনীর</text><text x="535" y="1000.5" class="bn">চেয়ে বেশি কিছু না। নায়কের</text><text x="535" y="1045.5" class="bn">অ্যাকশনগুলো একটু বেশিই ভেলান্টিয়ার</text><text x="535" y="1090.5" class="bn">লাগছে, আর ফুল আর ধনী বাবুর প্রেম—এটা</text><text x="535" y="1135.5" class="bn">আগে দেখিনি!</text><line x1="36" y1="1165" x2="1364" y2="1165" class="rule"/></svg>