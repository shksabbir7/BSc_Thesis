<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 90 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Backbone ablation and frozen LaBSE reference</title>
  <desc id="desc">Mean macro-F1 and seed standard deviation for seven evaluated models on dev-82. A vertical baseline marks the frozen LaBSE logistic probe at 0.9866. SetFit is shown by a filled diamond because no variability estimate is available.</desc>
  <rect x="0" y="90" width="1200" height="570" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #4d5966; }
    .label { font-size: 18px; }
    .tick { font-size: 15px; fill: #4d5966; }
    .note { font-size: 15px; fill: #4d5966; }
    .value { font-size: 15px; font-weight: 700; }
  </style>

  <!-- Plot frame and vertical grid -->
  <rect x="305" y="116" width="790" height="470" fill="none" stroke="#9aa5b1" stroke-width="1"/>
  <g stroke="#d9dee3" stroke-width="1">
    <line x1="305" y1="116" x2="305" y2="586"/>
    <line x1="437" y1="116" x2="437" y2="586"/>
    <line x1="568" y1="116" x2="568" y2="586"/>
    <line x1="700" y1="116" x2="700" y2="586"/>
    <line x1="832" y1="116" x2="832" y2="586"/>
    <line x1="963" y1="116" x2="963" y2="586"/>
    <line x1="1095" y1="116" x2="1095" y2="586"/>
  </g>

  <!-- Frozen-probe reference: x = 1007. -->
  <line x1="1007" y1="116" x2="1007" y2="586" stroke="#a33b20" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="995" y="108" text-anchor="end" class="value" fill="#a33b20">Frozen LaBSE probe 0.9866</text>

  <!-- Category labels -->
  <g class="label" text-anchor="end">
    <text x="284" y="163">BanglaBERT</text>
    <text x="284" y="228">SetFit–LaBSE</text>
    <text x="284" y="293">IndicBERTv2</text>
    <text x="284" y="358">MuRIL</text>
    <text x="284" y="423">mBERT</text>
    <text x="284" y="488">XLM-R</text>
    <text x="284" y="553">BERT-NLI</text>
  </g>

  <!-- SD whiskers and means; scale 0.88–1.00 -->
  <g stroke="#315f85" stroke-width="3">
    <line x1="725" y1="157" x2="1000" y2="157"/><line x1="725" y1="149" x2="725" y2="165"/><line x1="1000" y1="149" x2="1000" y2="165"/>
    <line x1="703" y1="287" x2="908" y2="287"/><line x1="703" y1="279" x2="703" y2="295"/><line x1="908" y1="279" x2="908" y2="295"/>
    <line x1="458" y1="352" x2="973" y2="352"/><line x1="458" y1="344" x2="458" y2="360"/><line x1="973" y1="344" x2="973" y2="360"/>
    <line x1="619" y1="417" x2="784" y2="417"/><line x1="619" y1="409" x2="619" y2="425"/><line x1="784" y1="409" x2="784" y2="425"/>
    <line x1="529" y1="482" x2="817" y2="482"/><line x1="529" y1="474" x2="529" y2="490"/><line x1="817" y1="474" x2="817" y2="490"/>
    <line x1="524" y1="547" x2="742" y2="547"/><line x1="524" y1="539" x2="524" y2="555"/><line x1="742" y1="539" x2="742" y2="555"/>
  </g>
  <g fill="#315f85" stroke="#ffffff" stroke-width="2">
    <circle cx="862" cy="157" r="8"/>
    <circle cx="806" cy="287" r="8"/>
    <circle cx="716" cy="352" r="8"/>
    <circle cx="701" cy="417" r="8"/>
    <circle cx="673" cy="482" r="8"/>
    <circle cx="633" cy="547" r="8"/>
  </g>
  <!-- SetFit effective single configuration -->
  <rect x="817" y="213" width="18" height="18" transform="rotate(45 826 222)" fill="#315f85" stroke="#ffffff" stroke-width="2"/>

  <!-- Direct values -->
  <g class="value">
    <text x="876" y="143">0.9647</text>
    <text x="846" y="227">0.9590</text>
    <text x="820" y="273">0.9560</text>
    <text x="730" y="338">0.9421</text>
    <text x="715" y="403">0.9402</text>
    <text x="687" y="468">0.9360</text>
    <text x="647" y="533">0.9298</text>
  </g>

  <!-- X axis -->
  <g class="tick" text-anchor="middle">
    <text x="305" y="612">0.88</text><text x="437" y="612">0.90</text>
    <text x="568" y="612">0.92</text><text x="700" y="612">0.94</text>
    <text x="832" y="612">0.96</text><text x="963" y="612">0.98</text>
    <text x="1095" y="612">1.00</text>
  </g>
  <text x="700" y="645" text-anchor="middle" class="label">Macro-F1 on dev-82</text>
</svg>
